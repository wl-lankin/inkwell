  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M32 9.5C32 9.5 16.5 27.5 16.5 38.5a15.5 15.5 0 0 0 31 0C47.5 27.5 32 9.5 32 9.5Z" fill="url(#drop)"/>
    <path d="M32 29v14.5M25.5 37.5 32 44l6.5-6.5" fill="none" stroke="#2a37b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
