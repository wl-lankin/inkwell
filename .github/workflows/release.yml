name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.0). Leave empty to build the selected branch.'
        required: false
      publish:
        description: 'Upload the build to the GitHub release for this tag'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Mac builds are signed and notarized once these secrets exist (see README > Code signing).
  MAC_SIGNING: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: macOS
            os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only set when the secrets exist: an empty CSC_LINK makes electron-builder fail.
      - name: Prepare Apple signing certificate and notarization key
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "CSC_LINK=$RUNNER_TEMP/apple/cert.p12" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS app
        if: runner.os == 'macOS'
        run: |
          APP="dist/mac-universal/Inkwell.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier|Format'
          lipo -archs "$APP/Contents/MacOS/Inkwell"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist"
          if [ "$MAC_SIGNING" = "true" ]; then
            # Must say "accepted" and "source=Notarized Developer ID", or Gatekeeper will block it.
            spctl --assess --type execute --verbose=4 "$APP"
            xcrun stapler validate "$APP"
          else
            echo "::warning::macOS build is ad-hoc signed. Add the Apple signing secrets to notarize it."
          fi

      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          "dist/mac-universal/Inkwell.app/Contents/MacOS/Inkwell" "$PWD/docs/Welcome.md" &
          sleep 12
          screencapture -x smoke-macos.png
          pkill -f Inkwell.app || true

      - name: Upload smoke screenshot
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: smoke-macos.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: out
          merge-multiple: true

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Inkwell ${TAG#v}" --generate-notes
          gh release upload "$TAG" out/* --clobber
